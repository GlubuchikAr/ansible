---
- name: Install Vector | Get Vector distrib
  ansible.builtin.copy:
    src: templates/0.48.0-1.x86_64.rpm
    dest: "/tmp/vector-0.48.0-1.x86_64.rpm"
    mode: "0644"

- name: Install Vector | RPM install
  become: true
  ansible.builtin.dnf:
    name: "/tmp/vector-0.48.0-1.x86_64.rpm"
    state: present
    disable_gpg_check: yes
  notify: restart vector service