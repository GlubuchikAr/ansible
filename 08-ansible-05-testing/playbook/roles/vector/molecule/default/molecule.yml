---
driver:
  name: docker
lint:
  ansible-lint .
  yamllint .
platforms:
  - name: ubuntu
    image: geerlingguy/docker-ubuntu2004-ansible
    pre_build_image: true

  - name: fedora
    image: docker.io/pycontribs/fedora:latest
    pre_build_image: true

provisioner:
  name: ansible
verifier:
  name: ansible
